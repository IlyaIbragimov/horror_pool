name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Backend tests and package
        run: ./mvnw -B clean package

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/horror_pool-0.0.1-SNAPSHOT.jar

  smoke:
    runs-on: ubuntu-latest
    needs: build
    env:
      POSTGRES_DB: horror_pool
      POSTGRES_USER: horror_pool
      POSTGRES_PASSWORD: ci_postgres_password
      SPRING_APP_JWT_SECRET: ZmFrZS1jaS1qd3Qtc2VjcmV0LWZha2UtY2ktand0LXNlY3JldA==
      TMDB_READ_TOKEN: dummy_ci_token
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8080
      FRONTEND_PORT: 8080
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Production stack up
        run: docker compose -f docker-compose.prod.yml up --build -d

      - name: Wait for frontend and API
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8080/ > /dev/null \
              && curl -fsS http://localhost:8080/horrorpool/public/csrf > /dev/null; then
              echo "Production stack is UP"; exit 0
            fi
            echo "Waiting for production stack... ($i)"; sleep 2
          done
          echo "Production stack did not become healthy in time"; exit 1

      - name: Check SPA route fallback
        run: curl -fsS http://localhost:8080/movies | grep -q '<div id="root">'

      - name: Print logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color

      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
