services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-horror_pool}
      POSTGRES_USER: ${POSTGRES_USER:-horror_pool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horror_pool} -d ${POSTGRES_DB:-horror_pool}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-horror_pool}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-horror_pool}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SPRING_APP_JWT_SECRET: ${SPRING_APP_JWT_SECRET:?set in .env}
      SPRING_APP_COOKIE_SECURE: "true"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?set in .env}
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:?set in .env}

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: /horrorpool
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: